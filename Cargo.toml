[package]
name = "baramos"
version = "0.1.0"
edition = "2021"
authors = ["BaramOS Project"]
description = "A small UEFI-based ARM64 OS with mouse cursor and keyboard input"

[[bin]]
name = "bootaa64"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.38", features = ["alloc", "logger", "panic_handler", "global_allocator"] }
uefi-raw = "0.15"
stb_truetype_rust = { path = "src/stb_truetype_rust" }
libm = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = false
