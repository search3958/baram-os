[workspace]
members = [
    "crates/baram-core",
    "crates/baram-font",
    "crates/baram-graphics",
    "crates/baram-iokit",
    "crates/baram-bsd",
    "crates/baram-windowserver",
    "crates/baram-kern",
    ".",
]

[workspace.dependencies]
uefi = { version = "0.38", features = ["alloc", "logger", "global_allocator"] }
uefi-raw = "0.15"
libm = "0.2"
kurbo = { version = "0.13", default-features = false, features = ["libm"] }
stb_truetype_rust = { path = "src/stb_truetype_rust" }
png-decoder = { path = "src/png-decoder" }

[package]
name = "baramos"
version = "0.1.0"
edition = "2021"
authors = ["BaramOS Project"]
description = "A small UEFI-based ARM64 OS with mouse cursor and keyboard input"

[[bin]]
name = "bootaa64"
path = "src/main.rs"

[[bin]]
name = "baram-kernel"
path = "src/kernel.rs"

[[bin]]
name = "windowserver"
path = "src/bin/windowserver.rs"

[[bin]]
name = "font"
path = "src/bin/font.rs"

[[bin]]
name = "graphics"
path = "src/bin/graphics.rs"

[[bin]]
name = "iokit"
path = "src/bin/iokit.rs"

[[bin]]
name = "bsd"
path = "src/bin/bsd.rs"

[dependencies]
baram-core = { path = "crates/baram-core" }
baram-font = { path = "crates/baram-font" }
baram-graphics = { path = "crates/baram-graphics" }
baram-iokit = { path = "crates/baram-iokit" }
baram-bsd = { path = "crates/baram-bsd" }
baram-windowserver = { path = "crates/baram-windowserver" }
baram-kern = { path = "crates/baram-kern" }
png-decoder = { path = "src/png-decoder" }
uefi = { workspace = true }
uefi-raw = { workspace = true }
libm = { workspace = true }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = false
