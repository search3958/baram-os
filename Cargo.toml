cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/baram-linux-bridge"]

[workspace.dependencies]
uefi = { version = "0.38", features = ["alloc", "logger", "global_allocator"] }
uefi-raw = { version = "0.15" }
libm = "0.2"
kurbo = { version = "0.13", default-features = false, features = ["libm"] }
blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
esp-hal = { version = "1.2", default-features = false }
embedded-hal = { version = "1" }

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 8
panic = "immediate-abort"
strip = false
overflow-checks = false
incremental = true
