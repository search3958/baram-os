set timeout=0
set default=0
set quiet=1
set gfxmode=1280x720x32,auto
set gfxpayload=keep
terminal_output gfxterm
menuentry "baram-os" {
    multiboot /boot/kernel.bin
    module /boot/MPLUS2-Regular.ttf
    module /boot/menubar.warp menubar.warp
    module /boot/new.warp new.warp
    module /boot/terminal.warp terminal.warp
    module /boot/test.warp test.warp
    module /boot/main.warpc main.warpc
    module /boot/bootlogo.svg bootlogo.svg
    module /boot/wallpaper_1.svg wallpaper_1.svg
    module /boot/wallpaper_2.svg wallpaper_2.svg
    boot
}
